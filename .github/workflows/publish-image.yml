# Publishes the demo app image to GitHub Container Registry so Cycode can scan it.
# Uses plain docker commands (no third-party actions) to satisfy Cycode's CI/CD policy.
name: Publish container image
on:
  push:
    branches: [master]
    paths: [Dockerfile, .github/workflows/publish-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push image
        run: |
          docker build -t ghcr.io/ali-cycode-demo/java-sec-code:latest .
          docker push ghcr.io/ali-cycode-demo/java-sec-code:latest
 
