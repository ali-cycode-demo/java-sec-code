name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

# Misconfiguration: the job token gets write access to everything
permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Misconfiguration: actions referenced by tag/branch, not pinned to a commit SHA
      - uses: actions/checkout@v2
      - uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: '8'

      - name: Build
        run: echo "Build step placeholder for the demo"
